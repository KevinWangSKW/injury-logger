/* ---------------------------------------------------------
   Storage helpers — plain browser localStorage, fully offline,
   fully on-device. Nothing leaves the phone/computer.
   Note: keys keep their original "bodylog-" prefix on purpose,
   so anyone who already used the deployed app doesn't lose data.
   --------------------------------------------------------- */
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {
    /* best effort — e.g. storage full or unavailable */
  }
}
async function loadInjuries() { return loadJSON("bodylog-injuries", []); }
async function saveInjuries(list) { saveJSON("bodylog-injuries", list); }
async function loadFlags() { return loadJSON("bodylog-flags", {}); }
async function saveFlags(flags) { saveJSON("bodylog-flags", flags); }
async function loadDone() { return loadJSON("bodylog-reminders-done", {}); }
async function saveDone(done) { saveJSON("bodylog-reminders-done", done); }

/* ---------------------------------------------------------

   --------------------------------------------------------- */
function Pill({ children, color, bg }) {

    <span
      style={{

        padding: "3px 10px", borderRadius: 20, letterSpacing: 0.1,

}

// Voice dictation button — sits inside a text field, appends spoken text.
// Renders nothing if the browser doesn't support speech recognition
// (works well on Chrome/Android; support on Safari/iOS varies).
function MicButton({ onResult }) {
  const [listening, setListening] = useState(false);
  const [errored, setErrored] = useState(false);
  const recRef = useRef(null);
  const SpeechRec = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
  if (!SpeechRec) return null;

  const buildRecognition = () => {
    const rec = new SpeechRec();
    rec.lang = "en-US";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.continuous = false;
    rec.onstart = () => { setErrored(false); setListening(true); };
    rec.onresult = (e) => {
      const transcript = e.results?.[0]?.[0]?.transcript?.trim();
      if (transcript) onResult(transcript);
    };
    rec.onend = () => { setListening(false); recRef.current = null; };
    rec.onerror = () => { setListening(false); setErrored(true); recRef.current = null; };
    return rec;
  };

  const start = () => {
    // Clear out anything left over from a previous attempt first — reusing
    // a stale instance, or starting a new one while an old one hasn't fully
    // ended, is what makes this silently stop working after the first use.
    if (recRef.current) {
      try { recRef.current.abort(); } catch { /* already stopped */ }
      recRef.current = null;
    }
    const rec = buildRecognition();
    recRef.current = rec;
    try {
      rec.start();
    } catch {
      setListening(false);
      setErrored(true);
      recRef.current = null;
    }
  };
  const stop = () => {
    if (recRef.current) {
      try { recRef.current.stop(); } catch { /* already stopped */ }
    }
    setListening(false);
  };

  return (
    <button
      type="button"
      onClick={listening ? stop : start}
      title={listening ? "Stop dictating" : errored ? "Didn't catch that — tap to try again" : "Dictate"}
      style={{
        position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)",
        background: listening ? "#B5432E" : errored ? "#F4E1DC" : "#EAF1EF",
        color: listening ? "#fff" : errored ? "#B5432E" : "#2F6F63",
        border: "none", borderRadius: 7, width: 25, height: 25, fontSize: 12.5,
        cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0,
      }}
    >
      {listening ? "●" : errored ? "!" : "🎤"}
    </button>
  );
}

// Wrapper: a text field (input or textarea) with a mic button inside it.
function VoiceField({ as = "input", value, onChange, wrapperStyle, ...rest }) {
  const Tag = as;
  const appendText = (t) => onChange((value ? value + " " : "") + t);
  return (
    <div style={{ position: "relative", ...wrapperStyle }}>
      <Tag
        value={value}
        onChange={(e) => onChange(e.target.value)}
        {...rest}
        style={{ ...rest.style, paddingRight: 36 }}
      />
      <MicButton onResult={appendText} />
    </div>
  );
}

}

/* ---------------------------------------------------------
   Region panel — log a new issue, or add an instance to an existing one
   --------------------------------------------------------- */
function RegionPanel({ regionId, existing, onClose, onCreateNew, onAddInstance }) {
  const [mode, setMode] = useState(existing.length ? "choose" : "new");
  const [targetId, setTargetId] = useState(null);
  const [cause, setCause] = useState("");
  const [pain, setPain] = useState(4);
  const [date, setDate] = useState(todayStr());
  const [notes, setNotes] = useState("");

  const submitNew = () => {
    onCreateNew({ regionId, cause, pain, date, notes });
    onClose();
  };
  const submitInstance = () => {
    onAddInstance(targetId, { pain, date, notes });
    onClose();
  };

  return (
    <div
      style={{
        position: "fixed", inset: 0, background: "rgba(23,33,31,0.5)",
        display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50,
      }}
      onClick={onClose}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: "#FBFCFB", borderRadius: "18px 18px 0 0", padding: "22px 20px 26px",
          maxWidth: 430, width: "100%", maxHeight: "82vh", overflowY: "auto",
          boxShadow: "0 -8px 30px rgba(0,0,0,0.18)",
        }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontSize: 16.5, fontWeight: 700, color: "#1B2B29" }}>{REGION_LABEL[regionId]}</div>
          <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, color: "#7A8B87", cursor: "pointer", lineHeight: 1 }}>×</button>
        </div>

        {mode === "choose" && (
          <div>
            <div style={{ fontSize: 13.5, color: "#4B5F5C", marginBottom: 10 }}>
              You already have injuries logged here. Add a new instance to one, or start a new record.
            </div>
            {existing.map((inj) => (
              <button
                key={inj.id}
                onClick={() => { setTargetId(inj.id); setMode("instance"); }}
                style={{
                  display: "block", width: "100%", textAlign: "left", background: "#fff",
                  border: "1px solid #DCE6E3", borderRadius: 10, padding: "10px 12px", marginBottom: 8, cursor: "pointer",
                }}
              >
                <span style={{ fontSize: 14, fontWeight: 600, color: "#1B2B29" }}>
                  {inj.cause || "Injury"}
                </span>
                <span style={{ float: "right" }}>
                  <Pill color={STATUS_META[inj.status].color} bg={STATUS_META[inj.status].bg}>
                    {STATUS_META[inj.status].label}
                  </Pill>
                </span>
              </button>
            ))}
            <button
              onClick={() => setMode("new")}
              style={{
                width: "100%", background: "none", border: "1px dashed #9FBDB6", borderRadius: 10,
                padding: "10px 0", fontSize: 13.5, color: "#2F6F63", fontWeight: 600, cursor: "pointer", marginTop: 4,
              }}
            >
              + Log a new, separate injury here
            </button>
          </div>
        )}

        {mode === "new" && (
          <div>
            <label style={fieldLabel}>What happened?</label>
            <VoiceField value={cause} onChange={setCause} placeholder="e.g. Rolled it during a run" style={inputStyle} />
            <label style={fieldLabel}>Date</label>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle} />
            <PainSlider pain={pain} setPain={setPain} />
            <label style={fieldLabel}>Notes (optional)</label>
            <VoiceField as="textarea" value={notes} onChange={setNotes} rows={2} style={{ ...inputStyle, resize: "none" }} />
            <button onClick={submitNew} disabled={!cause.trim()} style={primaryBtn(!cause.trim())}>
              Save injury
            </button>
          </div>
        )}

        {mode === "instance" && (
          <div>
            <div style={{ fontSize: 13.5, color: "#4B5F5C", marginBottom: 10 }}>Logging a new instance for this injury.</div>
            <label style={fieldLabel}>Date</label>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle} />
            <PainSlider pain={pain} setPain={setPain} />
            <label style={fieldLabel}>Notes (optional)</label>
            <VoiceField as="textarea" value={notes} onChange={setNotes} rows={2} style={{ ...inputStyle, resize: "none" }} />
            <button onClick={submitInstance} style={primaryBtn(false)}>Save instance</button>
          </div>
        )}
      </div>
    </div>
  );
}

function PainSlider({ pain, setPain }) {
  return (
    <div style={{ margin: "12px 0 4px" }}>
      <label style={fieldLabel}>Pain right now: <span style={{ color: PAIN_COLOR(pain), fontWeight: 700 }}>{pain}/10</span></label>

        style={{ width: "100%", accentColor: PAIN_COLOR(pain) }} />
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#8A9C98" }}>
        <span>No pain</span><span>Worst pain</span>
      </div>
    </div>
  );
}

const fieldLabel = { display: "block", fontSize: 12.5, fontWeight: 600, color: "#4B5F5C", margin: "10px 0 5px" };
const inputStyle = {
  width: "100%", boxSizing: "border-box", border: "1px solid #DCE6E3", borderRadius: 9,
  padding: "9px 11px", fontSize: 14, color: "#1B2B29", background: "#fff", outline: "none",
};
const primaryBtn = (disabled) => ({
  width: "100%", marginTop: 16, background: disabled ? "#B7C9C4" : "#2F6F63", color: "#fff",
  border: "none", borderRadius: 10, padding: "12px 0", fontSize: 14.5, fontWeight: 600,
  cursor: disabled ? "default" : "pointer",

/* ---------------------------------------------------------
   Injury detail
   --------------------------------------------------------- */
function InjuryDetail({ injury, onClose, onUpdate, onDelete, onDeleteInstance, flags, setFlags }) {
  const [tab, setTab] = useState("timeline");
  const [showDiagDisclaimer, setShowDiagDisclaimer] = useState(false);
  const [showRehabDisclaimer, setShowRehabDisclaimer] = useState(false);
  const [diagPick, setDiagPick] = useState("");
  const [exercises, setExercises] = useState(injury.rehabPlan?.exercises || []);
  const [rehabNotes, setRehabNotes] = useState(injury.rehabPlan?.notes || "");
  const [confirmDeleteInjury, setConfirmDeleteInjury] = useState(false);
  const [confirmInstanceId, setConfirmInstanceId] = useState(null);

  const group = REGION_GROUP[injury.regionId];
  const options = REF_GROUPS[group] || [];

  const startDiagnosis = () => {
    if (flags.diagnosis) setDiagPick("__form");
    else setShowDiagDisclaimer(true);
  };
  const ackDiagnosis = () => {
    setShowDiagDisclaimer(false);
    setFlags({ ...flags, diagnosis: true });
    setDiagPick("__form");
  };
  const startRehab = () => {
    if (flags.rehab) setTab("rehab-edit");
    else setShowRehabDisclaimer(true);
  };
  const ackRehab = () => {
    setShowRehabDisclaimer(false);
    setFlags({ ...flags, rehab: true });
    setTab("rehab-edit");
  };

  const saveDiagnosis = (name) => {
    onUpdate({ ...injury, doctorDiagnosis: name, status: injury.status === "active" ? "recovering" : injury.status });
    setDiagPick("");
  };

  const addExerciseRow = () =>
    setExercises([...exercises, { id: uid(), name: "", sets: "", freq: "", restrictions: "" }]);

  const removeExerciseRow = (id) => setExercises(exercises.filter((ex) => ex.id !== id));

    onUpdate({ ...injury, rehabPlan: { exercises, notes: rehabNotes } });

    <div style={{ position: "fixed", inset: 0, background: "#F6F8F7", zIndex: 40, overflowY: "auto" }}>

          {confirmDeleteInjury ? (
            <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 12.5, color: "#B5432E", fontWeight: 600 }}>Delete this whole record?</span>

          <div>
            <div style={{ fontSize: 19, fontWeight: 700, color: "#1B2B29" }}>{REGION_LABEL[injury.regionId]}</div>
            <div style={{ fontSize: 13.5, color: "#5A6D69", marginTop: 2 }}>{injury.cause}</div>
          </div>
          <Pill color={STATUS_META[injury.status].color} bg={STATUS_META[injury.status].bg}>
            {STATUS_META[injury.status].label}
          </Pill>
        </div>

        <div style={{ display: "flex", gap: 6, margin: "16px 0 14px" }}>
          {["active", "recovering", "resolved", "recurring"].map((s) => (
            <button
              key={s}
              onClick={() => onUpdate({ ...injury, status: s })}
              style={{
                fontSize: 11.5, fontWeight: 600, padding: "6px 10px", borderRadius: 20, cursor: "pointer",
                border: injury.status === s ? "none" : "1px solid #DCE6E3",
                background: injury.status === s ? STATUS_META[s].bg : "#fff",
                color: injury.status === s ? STATUS_META[s].color : "#7A8B87",
              }}
            >
              {STATUS_META[s].label}
            </button>
          ))}
        </div>

        <div style={{ display: "flex", borderBottom: "1px solid #DCE6E3", marginBottom: 14 }}>
          {[["timeline", "Timeline"], ["diagnosis", "Diagnosis"], ["rehab", "Rehab plan"]].map(([k, l]) => (

/* ---------------------------------------------------------
   Reminders tab
   --------------------------------------------------------- */
function RemindersTab({ injuries, done, toggleDone }) {
  const today = todayStr();
  const items = [];
  injuries
    .filter((i) => i.status === "active" || i.status === "recovering")
    .forEach((inj) => {
      (inj.rehabPlan?.exercises || []).forEach((ex) => {
        if (ex.name.trim()) items.push({ key: `${inj.id}_${ex.id}`, region: REGION_LABEL[inj.regionId], ...ex });
      });
    });

  if (!items.length) {
    return (
      <div style={{ textAlign: "center", padding: "60px 20px", color: "#8A9C98", fontSize: 13.5 }}>
        No active rehab plans yet. Add one from an injury's detail page to see reminders here.
      </div>
    );
  }

  return (
    <div>
      <div style={{ fontSize: 12.5, fontWeight: 700, color: "#5A6D69", marginBottom: 10 }}>
        Today · {new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}
      </div>
      {items.map((it) => {
        const checked = !!done[`${today}_${it.key}`];
        return (
          <label key={it.key}
            style={{
              display: "flex", alignItems: "flex-start", gap: 10, background: "#fff", border: "1px solid #E3EAE8",
              borderRadius: 12, padding: "12px 14px", marginBottom: 8, cursor: "pointer",
            }}>
            <input type="checkbox" checked={checked} onChange={() => toggleDone(`${today}_${it.key}`)} style={{ marginTop: 3, accentColor: "#2F6F63" }} />
            <div style={{ flex: 1, textDecoration: checked ? "line-through" : "none", opacity: checked ? 0.55 : 1 }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: "#1B2B29" }}>{it.name}</div>
              <div style={{ fontSize: 12, color: "#8A9C98", marginTop: 1 }}>{it.region} · {it.sets} {it.sets && it.freq && "·"} {it.freq}</div>

          </label>
        );
      })}
    </div>
  );
}

/* ---------------------------------------------------------

  const [regionFilter, setRegionFilter] = useState("all");
  const [diagFilter, setDiagFilter] = useState("all");

  const regionsPresent = [...new Set(injuries.map((i) => i.regionId))];
  const diagnosesPresent = [...new Set(injuries.filter((i) => i.doctorDiagnosis).map((i) => i.doctorDiagnosis))];

  const filtered = injuries.filter((i) => {

    if (diagFilter !== "all" && i.doctorDiagnosis !== diagFilter) return false;

  const allInstances = filtered.flatMap((i) => i.instances);
  const avgPain = allInstances.length ? (allInstances.reduce((s, x) => s + x.pain, 0) / allInstances.length).toFixed(1) : null;
  const allDates = allInstances.map((x) => x.date).sort();
  const dateRange = allDates.length ? `${fmtDate(allDates[0])} – ${fmtDate(allDates[allDates.length - 1])}` : null;

      <div style={{ textAlign: "center", padding: "60px 20px", color: "#8A9C98", fontSize: 13.5 }}>
        Nothing logged yet, so there's nothing to report on.

  return (
    <div>
      <style>{`
        @media print {
          .no-print { display: none !important; }
          body { background: #fff !important; }
          .print-card { break-inside: avoid; border: 1px solid #ccc !important; }

      <div className="no-print" style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <select value={regionFilter} onChange={(e) => setRegionFilter(e.target.value)} style={{ ...inputStyle, flex: 1 }}>
          <option value="all">All regions</option>
          {regionsPresent.map((id) => <option key={id} value={id}>{REGION_LABEL[id]}</option>)}

      </div>

      {!filtered.length ? (
        <div style={{ textAlign: "center", padding: "40px 20px", color: "#8A9C98", fontSize: 13.5 }}>
          No injuries match that filter.
        </div>
      ) : (
        <>
          <div className="print-card" style={{ background: "#fff", border: "1px solid #E3EAE8", borderRadius: 12, padding: "14px 16px", marginBottom: 14 }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: "#1B2B29", marginBottom: 6 }}>Summary</div>
            <div style={{ fontSize: 13, color: "#4B5F5C", lineHeight: 1.7 }}>

              <div key={inj.id} className="print-card" style={{ background: "#fff", border: "1px solid #E3EAE8", borderRadius: 12, padding: "14px 16px", marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
                  <div style={{ fontSize: 14.5, fontWeight: 700, color: "#1B2B29" }}>{REGION_LABEL[inj.regionId]}</div>
                  <Pill color={STATUS_META[inj.status].color} bg={STATUS_META[inj.status].bg}>{STATUS_META[inj.status].label}</Pill>
                </div>
                <div style={{ fontSize: 12.5, color: "#5A6D69", marginBottom: 8 }}>{inj.cause}</div>
                {inj.doctorDiagnosis && (
                  <div style={{ fontSize: 12.5, color: "#1B2B29", marginBottom: 8 }}>
                    <strong>Diagnosed:</strong> {inj.doctorDiagnosis}

                <div style={{ fontSize: 12, fontWeight: 700, color: "#8A9C98", marginBottom: 4 }}>TIMELINE</div>
                {sorted.map((inst) => (
                  <div key={inst.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: "#3E4F4B", padding: "3px 0", borderTop: "1px solid #F0F3F2" }}>
                    <span>{fmtDate(inst.date)}{inst.notes ? ` — ${inst.notes}` : ""}</span>
                    <span style={{ fontWeight: 700, color: PAIN_COLOR(inst.pain) }}>{inst.pain}/10</span>
                  </div>
                ))}
                {inj.rehabPlan?.exercises?.length > 0 && (
                  <>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#8A9C98", marginTop: 8, marginBottom: 4 }}>REHAB PLAN ON FILE</div>
                    {inj.rehabPlan.exercises.map((ex) => (
                      <div key={ex.id} style={{ fontSize: 12.5, color: "#3E4F4B", padding: "2px 0" }}>

// 3D landmark points (x, y, z) in the loaded model's own coordinate space —
// used only to classify a tap into one of the app's region ids (for the
// diagnosis reference list / reports). Measured from the real mesh: it's a
// T-pose figure, ~200 units tall, arm-span ~200, torso depth about -16
// (back) to +24 (front). First-pass approximation — nearest-point matching.
const LANDMARKS_3D = {
  head: [0, 192, 3], neck: [0, 175, 2],
  left_chest: [-14, 142, 15], right_chest: [14, 142, 15],
  left_upper_back: [-14, 142, -10], right_upper_back: [14, 142, -10],
  left_abdomen: [-14, 112, 13], right_abdomen: [14, 112, 13],
  left_lower_back: [-14, 112, -9], right_lower_back: [14, 112, -9],
  left_shoulder: [-24, 158, 2], right_shoulder: [24, 158, 2],
  left_upper_arm: [-40, 157, 1], right_upper_arm: [40, 157, 1],
  left_elbow: [-55, 156, 1], right_elbow: [55, 156, 1],
  left_forearm: [-72, 155, 1], right_forearm: [72, 155, 1],
  left_wrist_hand: [-90, 154, 1], right_wrist_hand: [90, 154, 1],
  left_hip: [-11, 100, 3], right_hip: [11, 100, 3],
  left_thigh: [-11, 78, 2], right_thigh: [11, 78, 2],
  left_knee: [-11, 57, 2], right_knee: [11, 57, 2],
  left_lower_leg: [-10, 35, 1], right_lower_leg: [10, 35, 1],
  left_ankle_foot: [-10, 6, 3], right_ankle_foot: [10, 6, 3],
};

function nearestRegion3D(point) {
  let best = null, bestDist = Infinity;
  for (const id in LANDMARKS_3D) {
    const [x, y, z] = LANDMARKS_3D[id];
    const d = (point.x - x) ** 2 + (point.y - y) ** 2 + (point.z - z) ** 2;
    if (d < bestDist) { bestDist = d; best = id; }
  }
  return best;
}

// The 3D body picker — replaces the 2D map on the deployed build only
// (the chat preview can't load the uploaded .glb as a servable file).
//
// Each injury gets its own marker at the exact 3D point it was tapped at
// (not a shared per-region dot), so two injuries in the same broad area
// show as two separate, distinct marks. Tapping directly on an existing
// marker offers to add to that specific injury or start a separate one;
// tapping anywhere else — even nearby, even in the "same" region — always
// starts a brand new point.
//
// onPick(regionId, point, hitInjuryId) — hitInjuryId is set only when the
// tap landed on an existing marker.
function Body3D({ injuries, onPick }) {
  const containerRef = useRef(null);
  const [status, setStatus] = useState("loading");
  const sceneRef = useRef({});

  useEffect(() => {
    const container = containerRef.current;
    if (!container || !window.THREE || !window.THREE.GLTFLoader) { setStatus("error"); return; }
    const THREE = window.THREE;

    const width = container.clientWidth;
    const height = container.clientHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, width / height, 1, 2000);
    camera.position.set(0, 115, 320);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(width, height);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(100, 220, 180);
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
    fillLight.position.set(-120, 80, -100);
    scene.add(fillLight);
    scene.background = new THREE.Color(0xE3EBE9);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 100, 0);
    controls.enablePan = true;
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT: THREE.MOUSE.PAN,
    };
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN,
    };
    controls.minDistance = 150;
    controls.maxDistance = 480;
    controls.update();
    // Right-click is now "pan", not the browser's context menu.
    renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());

    const markerGroup = new THREE.Group();
    scene.add(markerGroup);
    sceneRef.current = { markerGroup, THREE };

    let modelRoot = null;
    const raycaster = new THREE.Raycaster();
    raycaster.params.Points = { threshold: 6 };
    const pointer = new THREE.Vector2();

    new THREE.GLTFLoader().load(
      "./body-model.glb",
      (gltf) => {
        modelRoot = gltf.scene;
        // This particular file has cumulative baked-in scale transforms
        // (Sketchfab axis correction x 0.01 export scale x 0.9 body-node
        // scale = 0.009 total), which shrinks it to about 1/111th the size
        // the camera and landmark coordinates below were designed around.
        // Undo that so the model's real-world size matches those numbers.
        modelRoot.scale.setScalar(1 / 0.009);
        modelRoot.traverse((o) => {
          if (o.isMesh) {
            o.material = new THREE.MeshStandardMaterial({ color: 0x6F9B92, roughness: 0.85, metalness: 0 });
          }
        });
        scene.add(modelRoot);
        setStatus("ready");
      },
      undefined,
      () => setStatus("error")
    );

    // Tap vs. drag: a real tap on a touchscreen almost always includes a
    // pixel or two of natural finger movement, so "any movement = drag"
    // made taps feel unreliable. Only treat it as a drag/rotate past a
    // small real threshold.
    let downX = 0, downY = 0, moved = 0;
    const DRAG_THRESHOLD = 8;
    const onDown = (e) => {
      downX = e.clientX; downY = e.clientY; moved = 0;
    };
    const onMove = (e) => {
      moved = Math.max(moved, Math.hypot(e.clientX - downX, e.clientY - downY));
    };
    const onTap = (e) => {
      if (moved > DRAG_THRESHOLD || !modelRoot) return;
      const rect = renderer.domElement.getBoundingClientRect();
      const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      // Check existing marker balls first — hitting one means "add to
      // this specific injury or start separate", never a generic region.
      let hitInjuryId = null;
      const markerHits = raycaster.intersectObjects(markerGroup.children, false);
      if (markerHits.length) hitInjuryId = markerHits[0].object.userData.injuryId;

      const hits = raycaster.intersectObject(modelRoot, true);
      if (hits.length) {
        const point = hits[0].point.clone();
        const regionId = nearestRegion3D(point);
        if (regionId) onPick(regionId, [point.x, point.y, point.z], hitInjuryId);
      }
    };
    const dom = renderer.domElement;
    dom.style.touchAction = "none";
    dom.addEventListener("pointerdown", onDown);
    dom.addEventListener("pointermove", onMove);
    dom.addEventListener("pointerup", onTap);

    let raf;
    const animate = () => {
      raf = requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    };
    animate();

    const handleResize = () => {
      const w = container.clientWidth, h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    window.addEventListener("resize", handleResize);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", handleResize);
      dom.removeEventListener("pointerdown", onDown);
      dom.removeEventListener("pointermove", onMove);
      dom.removeEventListener("pointerup", onTap);
      controls.dispose();
      renderer.dispose();
      if (container.contains(dom)) container.removeChild(dom);
    };
  }, []);

  // One marker per injury, at its own exact tapped point — not a shared
  // per-region dot. Injuries logged before this point existed (or from
  // the 2D map) have no stored point and simply don't get a 3D marker.
  useEffect(() => {
    const { markerGroup, THREE } = sceneRef.current;
    if (!markerGroup || !THREE) return;
    while (markerGroup.children.length) markerGroup.remove(markerGroup.children[0]);
    injuries.forEach((injury) => {
      if (injury.status === "resolved" || !injury.point) return;
      const color = new THREE.Color(STATUS_META[injury.status].color);
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(4, 16, 16),
        new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.3 })
      );
      sphere.position.set(injury.point[0], injury.point[1], injury.point[2]);
      sphere.userData.injuryId = injury.id;
      markerGroup.add(sphere);
    });
  }, [injuries]);

  return (
    <div>
      <div ref={containerRef} style={{ width: "100%", height: 420, borderRadius: 14, overflow: "hidden", background: "#E3EBE9" }} />
      {status === "loading" && <div style={{ textAlign: "center", fontSize: 12, color: "#8A9C98", marginTop: 10 }}>Loading 3D model…</div>}
      {status === "error" && (
        <div style={{ textAlign: "center", fontSize: 12, color: "#B5432E", marginTop: 10 }}>
          Couldn't load the 3D model — make sure body-model.glb is uploaded alongside this page.
        </div>
      )}
      {status === "ready" && (
        <div style={{ textAlign: "center", fontSize: 12, color: "#8A9C98", marginTop: 10 }}>
          Left-drag to rotate · right-drag to pan · tap a spot to log or review an issue there
        </div>
      )}
      <div style={{ textAlign: "center", fontSize: 10.5, color: "#B0BDB9", marginTop: 6 }}>
        3D model: "Human Body Base Mesh Male" by ferrumiron6, licensed CC BY 4.0
      </div>
    </div>
  );
}


/* ---------------------------------------------------------
   App
   --------------------------------------------------------- */
function InjuryLogger() {
  const [tab, setTab] = useState("map");
  const [bodyView, setBodyView] = useState("front");
  const [injuries, setInjuries] = useState([]);
  const [flags, setFlagsState] = useState({});
  const [done, setDoneState] = useState({});
  const [ready, setReady] = useState(false);
  const [pickedRegion, setPickedRegion] = useState(null);
  const [openInjuryId, setOpenInjuryId] = useState(null);
  const [tapPoint, setTapPoint] = useState(null);
  const [forcedInjuryId, setForcedInjuryId] = useState(null);

  useEffect(() => {
    (async () => {
      const [inj, fl, dn] = await Promise.all([loadInjuries(), loadFlags(), loadDone()]);
      setInjuries(inj); setFlagsState(fl); setDoneState(dn); setReady(true);
    })();
  }, []);

  const persistInjuries = (list) => { setInjuries(list); saveInjuries(list); };
  const setFlags = (f) => { setFlagsState(f); saveFlags(f); };
  const toggleDone = (key) => {
    const next = { ...done, [key]: !done[key] };
    setDoneState(next); saveDone(next);
  };

  const createInjury = ({ regionId, cause, pain, date, notes, point }) => {
    const inj = {
      id: uid(), regionId, cause, status: "active", createdAt: date,
      doctorDiagnosis: null, rehabPlan: null, point: point || null,
      instances: [{ id: uid(), date, pain, notes }],
    };
    persistInjuries([inj, ...injuries]);
  };
  const addInstance = (injuryId, { date, pain, notes }) => {
    persistInjuries(injuries.map((i) => i.id === injuryId ? { ...i, instances: [...i.instances, { id: uid(), date, pain, notes }] } : i));
  };
  const updateInjury = (updated) => {
    persistInjuries(injuries.map((i) => (i.id === updated.id ? updated : i)));
  };
  const deleteInjury = (id) => {
    persistInjuries(injuries.filter((i) => i.id !== id));
    setOpenInjuryId(null);
  };
  const deleteInstance = (injuryId, instanceId) => {
    persistInjuries(injuries.map((i) => (i.id === injuryId ? { ...i, instances: i.instances.filter((x) => x.id !== instanceId) } : i)));
  };

  const injuriesByRegion = {};
  injuries.forEach((i) => {
    if (i.status !== "resolved" && !injuriesByRegion[i.regionId]) injuriesByRegion[i.regionId] = i;
  });

  const openInjury = injuries.find((i) => i.id === openInjuryId);

  if (!ready) {
    return <div style={{ padding: 40, textAlign: "center", color: "#8A9C98", fontFamily: "sans-serif" }}>Loading…</div>;
  }

  return (
    <div style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif", background: "#EFF3F2", minHeight: 620 }}>
      <div style={{ maxWidth: 430, margin: "0 auto", padding: "20px 18px 90px", position: "relative" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 18 }}>
          <span style={{ fontSize: 19, fontWeight: 800, color: "#1B2B29", letterSpacing: -0.3 }}>Injury Logger</span>
          <span style={{ fontSize: 12, color: "#8A9C98" }}>{APP_VERSION} · {injuries.length} tracked</span>
        </div>

        {tab === "map" && (
          <Body3D
            injuries={injuries}
            onPick={(regionId, point, hitInjuryId) => {
              setPickedRegion(regionId);
              setTapPoint(point);
              setForcedInjuryId(hitInjuryId || null);
            }}
          />
        )}

        {tab === "injuries" && <InjuriesTab injuries={injuries} onOpen={setOpenInjuryId} />}
        {tab === "report" && <ReportTab injuries={injuries} />}
        {tab === "reminders" && <RemindersTab injuries={injuries} done={done} toggleDone={toggleDone} />}
      </div>

      <div className="no-print" style={{
        position: "fixed", bottom: 0, left: 0, right: 0, background: "#fff",
        borderTop: "1px solid #E3EAE8", display: "flex", justifyContent: "center", zIndex: 30,
      }}>
        <div style={{ maxWidth: 430, width: "100%", display: "flex" }}>
          {[["map", "Body map"], ["injuries", "Injuries"], ["report", "Report"], ["reminders", "Reminders"]].map(([k, l]) => (
            <button key={k} onClick={() => setTab(k)}
              style={{
                flex: 1, padding: "13px 0", background: "none", border: "none", cursor: "pointer",
                fontSize: 12.5, fontWeight: 600, color: tab === k ? "#2F6F63" : "#8A9C98",
                borderTop: tab === k ? "2px solid #2F6F63" : "2px solid transparent", marginTop: -1,
              }}>
              {l}
            </button>
          ))}
        </div>
      </div>

      {pickedRegion && (
        <RegionPanel
          regionId={pickedRegion}
          existing={forcedInjuryId ? injuries.filter((i) => i.id === forcedInjuryId) : []}
          onClose={() => { setPickedRegion(null); setTapPoint(null); setForcedInjuryId(null); }}
          onCreateNew={(payload) => createInjury({ ...payload, point: tapPoint })}
          onAddInstance={addInstance}
        />
      )}
      {openInjury && (
        <InjuryDetail
          injury={openInjury}
          onClose={() => setOpenInjuryId(null)}
          onUpdate={updateInjury}
          onDelete={() => deleteInjury(openInjury.id)}
          onDeleteInstance={(instanceId) => deleteInstance(openInjury.id, instanceId)}
          flags={flags}
          setFlags={setFlags}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<InjuryLogger />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {
        /* offline-caching just won't be active; app still works online */
      });
    });
  }
</script>
</body>
</html>
